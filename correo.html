<!DOCTYPE html>

<style>
/* ICOM_TOKENS:BEGIN -- generado desde design/tokens.css, no editar a mano, correr scripts/sync_design_tokens.py */
/* ICOM Salud — tokens de diseño compartidos.
   Fuente de verdad ÚNICA: este archivo. No se edita a mano en ningún
   otro lugar -- se copia (verbatim, entre marcadores ICOM_TOKENS)
   dentro del <style> del shell y de cada sub-app vía
   scripts/sync_design_tokens.py. Correr ese script con --check antes
   de cualquier commit que toque este archivo, para confirmar que los
   9 archivos quedaron sincronizados.

   Valores elegidos por uso real medido en el código existente (ver
   auditoría de diseño, 26/08/2026), no inventados -- cada uno es el
   valor que YA es mayoritario en la mayoría de las 9 pantallas. */
:root{
  /* Marca / acento */
  --accent:#007067;
  --accent-hover:#005a52;
  --accent-soft:#E6F2F1;

  /* Semánticos */
  --ok:#0F7A5A;
  --ok-bg:#E8F5E9;
  --warn:#a35b00;
  --warn-bg:#FFF3E0;
  --danger:#c0422a;
  --danger-bg:#FBEAE8;

  /* Texto y bordes (grises) */
  --ink:#222222;
  --ink-soft:#555555;   /* 10/09/2026: gris medio de texto -- consolida #555/#666 usados a mano en varias pantallas (ver auditoría UX Talento). Entre --ink y --muted. */
  --muted:#6b6b6b;      /* 08/10/2026: era #999 (2,85:1 sobre blanco, no pasa AA). #6b6b6b da 5,3:1. Todos los usos de --muted son texto sobre fondo claro (verificado en las 9 pantallas). */
  --faint:#cccccc;      /* 08/10/2026: sólo para bordes/decoración (1,5:1). NO usar para texto: usar --muted. */
  --line:#e0dfd8;
  --line-input:#dddddd;

  /* Superficies muy claras (fondos de tarjeta secundaria, hover, filas) */
  --surface-2:#f6f6f4;  /* 10/09/2026: consolida los ~7 blancos-grisáceos casi iguales (#f5f5f5/#fafafa/#f2f2f2/...) que se venían escribiendo a mano. */

  /* Radios */
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;

  /* Escala tipográfica */
  --fs-xs:11px;
  --fs-sm:12px;
  --fs-base:13px;
  --fs-md:14px;
  --fs-lg:16px;
  --fs-xl:20px;
  --fs-2xl:28px;
}

/* ── Capa móvil compartida (auditoría mobile, 15/10/2026) ──
   Se estampa en el shell y en todas las sub-apps junto con los tokens. Sólo actúa en pantallas angostas (celular / ventana chica); en escritorio no cambia nada.
   - Botones, selects e inputs de al menos 40 px de alto (antes la mayoría medía 22-30 px: difícil acertar con el dedo). Dentro de tablas queda en 32 px para no inflar las filas.
   - Inputs a 16 px: con menos, iPhone hace zoom solo al tocar el campo y la pantalla queda "pasada".
   - Se oculta el "usuario · rol" de cada sub-app (ya está en "Mi Cuenta" del menú) para ganar alto útil. */
@media (max-width:700px){
  button,select,.btn,.pm-btn,.xl-btn,.modo-btn,.sel-atajo,[role="button"]{min-height:40px}
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="hidden"]),select,textarea{min-height:40px;font-size:16px !important}
  td button,td select,td input:not([type="checkbox"]):not([type="radio"]),td .btn,td .pm-btn,td .xl-btn{min-height:32px} /* checkbox/radio quedan con su tamaño: con alto forzado se deformaban en óvalos */
  th.ordenable{min-height:36px}
  #sesionInfo{display:none !important}
  .foot-note{display:none !important} /* notas al pie ("Actualizado: ... Columnas 7d ..."): en celular sólo ocupan lugar */
  .filtros-row-especial > .muted{display:none} /* se saca el rótulo "Vista rápida:"; la fila deslizable deja asomar el próximo botón cortado a la mitad */
  #icomChipBar{display:none !important} /* los indicadores de sincronización viven en la barra verde del shell */
  .htitle span,.hsub-explica{display:none !important} /* sin subtítulos explicativos: queda sólo el título de cada pantalla */
  header{padding-top:8px;padding-bottom:8px}
  /* Filtros / vistas rápidas / pestañas: una sola fila deslizable en vez de 4-5 líneas de botones apilados (fade a la derecha = "hay más"). Clase .chip-slider para filas nuevas. */
  .chip-slider,.filtros-row-especial,.suc-tabs,.tabs:not(#tabsScroll),.org-filtro-unidades{
    display:flex;flex-wrap:nowrap !important;overflow-x:auto;overflow-y:hidden;gap:8px;padding-right:28px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 14px),transparent)}
  .chip-slider::-webkit-scrollbar,.filtros-row-especial::-webkit-scrollbar,.suc-tabs::-webkit-scrollbar,.tabs:not(#tabsScroll)::-webkit-scrollbar,.org-filtro-unidades::-webkit-scrollbar{display:none}
  .chip-slider > *,.filtros-row-especial > *,.suc-tabs > *,.tabs:not(#tabsScroll) > *,.org-filtro-unidades > *{flex:0 0 auto;scroll-snap-align:start;white-space:nowrap}
  .chip-slider .mode-toggle,.filtros-row-especial .mode-toggle{flex-wrap:nowrap}
  .filtros-row > .chip-slider{flex:1 1 100%;min-width:0}
  /* la barra de scroll horizontal flotante es para mouse: en celular se desliza con el dedo y la barra tapa/pisa los toques */
  #scrollHFloat{display:none !important}
  .table-wrap{overflow-y:hidden;-webkit-overflow-scrolling:touch}
}

/* ── Tarjetas de indicadores (KPI) -- TODAS las pantallas, escritorio y celular (criterio de alineación, 15/10/2026) ──
   Los números principales quedan CENTRADOS y en la MISMA línea visual en cada fila de tarjetas; los textos que los acompañan (etiqueta arriba, detalle abajo) se acomodan en el resto de la caja.
   Cada tarjeta es una grilla que comparte sus filas con las vecinas (subgrid): si una tarjeta tiene una línea de más (o aparece/desaparece un detalle, una variación, "Total · Pausadas"...),
   todas las de esa fila se reacomodan juntas y los números siguen alineados. :not(#_k) sube la especificidad para ganarle al CSS propio de cada pantalla sin pisar el display:none en línea de las filas ocultas. */
.kpi-row:not(#_k){display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;align-items:stretch}
.erp-kpis:not(#_k),.stk-kpis:not(#_k),.metrics:not(#_k),.metric-bar:not(#_k){display:grid;align-items:stretch}
.kpi-row > .kpi-card,.erp-kpis > .erp-kpi,.stk-kpis > .stk-kpi,.metrics > .metric,.metric-bar > .metric{
  display:grid;grid-template-rows:subgrid;grid-row:span 4;row-gap:2px;align-content:stretch;justify-items:center;text-align:center;min-width:0;margin:0}
.kpi-row > .kpi-card{position:relative;grid-template-columns:minmax(0,1fr);padding:14px 16px 12px;flex:none}
.kpi-row > .kpi-card > .kpi-text{display:contents}
/* el ícono va chico en la esquina superior izquierda (nunca tapa el número, que va centrado más abajo): el contenido (etiqueta · número · detalle) queda centrado en TODA la tarjeta y no se angosta por el ícono */
.kpi-row > .kpi-card > .kpi-icon{position:absolute;left:8px;top:8px;width:26px;height:26px;min-width:26px;font-size:13px;opacity:.9;pointer-events:none}
.kpi-row > .kpi-card .kpi-label{overflow-wrap:normal !important;word-break:normal !important;hyphens:none} /* sin cortar palabras ("CANCELACIONE S") */
.kpi-row > .kpi-card .kpi-label,.kpi-row > .kpi-card .kpi-value,.kpi-row > .kpi-card .kpi-sub{grid-column:1}
.kpi-row > .kpi-card .kpi-value{white-space:nowrap}
.kpi-row > .kpi-card .kpi-label,.erp-kpis > .erp-kpi > .lbl,.stk-kpis > .stk-kpi > .lbl,.metrics > .metric > .metric-label,.metric-bar > .metric > .metric-label{align-self:end;margin:0;text-align:center}
.kpi-row > .kpi-card .kpi-value,.erp-kpis > .erp-kpi > .val,.stk-kpis > .stk-kpi > .val,.metrics > .metric > .metric-value,.metric-bar > .metric > .metric-value{align-self:center;margin:0;text-align:center}
.kpi-row > .kpi-card .kpi-sub,.erp-kpis > .erp-kpi > .erp-kpi-sub,.stk-kpis > .stk-kpi > .sub,.metrics > .metric > .metric-sub,.metric-bar > .metric > .metric-sub,.erp-kpis > .erp-kpi > .erp-kpi-delta{align-self:start;margin:0;text-align:center;justify-content:center}
.metrics > .metric > .metric-bar-wrap{width:100%;align-self:end}
/* Fila fija para cada pieza (1 etiqueta · 2 número · 3 detalle · 4 variación/barra): si una tarjeta NO tiene detalle, su variación igual cae en la fila 4 y queda a la altura de la de la tarjeta vecina */
.kpi-row > .kpi-card .kpi-label,.erp-kpis > .erp-kpi > .lbl,.stk-kpis > .stk-kpi > .lbl,.metrics > .metric > .metric-label,.metric-bar > .metric > .metric-label{grid-row:1}
.kpi-row > .kpi-card .kpi-value,.erp-kpis > .erp-kpi > .val,.stk-kpis > .stk-kpi > .val,.metrics > .metric > .metric-value,.metric-bar > .metric > .metric-value{grid-row:2}
.kpi-row > .kpi-card .kpi-sub,.erp-kpis > .erp-kpi > .erp-kpi-sub,.stk-kpis > .stk-kpi > .sub,.metrics > .metric > .metric-sub,.metric-bar > .metric > .metric-sub{grid-row:3}
.erp-kpis > .erp-kpi > .erp-kpi-delta,.metrics > .metric > .metric-bar-wrap{grid-row:4}
.erp-kpis > .erp-kpi{grid-row:span 5} /* Ventas en Vivo: etiqueta · número · unidades · variación del total · variación de unidades */
.erp-kpis > .erp-kpi > .erp-kpi-delta-un{grid-row:5}
.exh-kpi{text-align:center}
.exh-kpi .val{justify-content:center}
@media (max-width:700px){
  .kpi-row:not(#_k),.erp-kpis:not(#_k),.stk-kpis:not(#_k),.metrics:not(#_k),.metric-bar:not(#_k){grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi-row > .kpi-card,.erp-kpis > .erp-kpi,.stk-kpis > .stk-kpi,.metrics > .metric,.metric-bar > .metric{padding:10px 8px}
  .kpi-row > .kpi-card > .kpi-icon{display:none}
  .kpi-row > .kpi-card:last-child:nth-child(odd){grid-column:1 / -1}
  .exh-kpi .lbl{min-height:2.5em;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
}

/* Botón "Excel" de cada tabla: un ícono chico en una franja finita propia, arriba y a la derecha de SU tabla. Va en el flujo normal (no flota), así que no tapa encabezados ni datos de nadie. */
.xl-barra{position:static;display:flex;justify-content:flex-end;align-items:center;height:auto !important;padding:2px 6px 3px !important;margin:0 !important;overflow:visible}
.xl-barra .xl-btn{border:1px solid var(--line,#e0dfd8);background:#fff;color:var(--accent,#007067);cursor:pointer;font:inherit;position:static;width:28px;height:24px;min-width:0;min-height:0 !important;padding:0 !important;font-size:0 !important;line-height:0;display:flex;align-items:center;justify-content:center;border-radius:7px;box-shadow:none;overflow:hidden}
.xl-barra .xl-btn:hover{background:var(--accent-soft,#e6f2f1);border-color:var(--accent,#007067)}
.xl-barra .xl-btn::before{content:"";width:14px;height:14px;background:var(--accent,#007067);-webkit-mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5'/%3E%3Cpath d='M4 17v3h16v-3'/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5'/%3E%3Cpath d='M4 17v3h16v-3'/%3E%3C/svg%3E") center/contain no-repeat}
/* ICOM_TOKENS:END */

:root{
  --accent:#007067;--accent-hover:#005a52;--accent-soft:#E6F2F1;
  --ok:#0F7A5A;--warn:#a35b00;--danger:#c0422a;
  --ink:#222;--ink-soft:#555;--muted:#6b6b6b;--line:#e0dfd8;--line-input:#ddd;--surface-2:#f6f6f4;
  --radius-md:10px;--radius-lg:16px;
  --fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%;background:#f7f6f2;color:var(--ink);font-size:var(--fs-base)}
body{display:flex;flex-direction:column;overflow:hidden;max-width:100vw}
button{font:inherit;cursor:pointer}
.barra{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.barra h1{font-size:var(--fs-lg);color:var(--accent);font-weight:700;margin-right:auto}
.chip-cuenta{font-size:var(--fs-sm);color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.chip-cuenta button{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:var(--fs-sm)}
.tabs{display:flex;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line-input);background:#fff;border-radius:999px;padding:0 16px;min-height:36px;font-weight:700;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.tab.activa{background:var(--accent);border-color:var(--accent);color:#fff}
.bdg{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center}
.btn{border:1px solid var(--line-input);background:#fff;color:var(--ink);border-radius:8px;padding:0 14px;min-height:36px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.55;cursor:default}
.cuerpo{flex:1;min-height:0;display:flex}
.vacio,.estado{padding:36px 20px;text-align:center;color:var(--muted)}
.tarjeta-conectar{margin:28px auto;max-width:520px;background:#fff;border-radius:var(--radius-lg);box-shadow:0 4px 24px rgba(0,0,0,.08);padding:28px 26px;text-align:center}
.tarjeta-conectar h2{color:var(--accent);font-size:var(--fs-xl);margin-bottom:8px}
.tarjeta-conectar p{color:var(--ink-soft);line-height:1.5;margin-bottom:16px}
.tarjeta-conectar .pasos{text-align:left;font-size:var(--fs-sm);color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:12px 14px 12px 28px;margin:12px 0 0;line-height:1.55}
.err{color:var(--danger)}
/* correo */
.mail{flex:1;display:flex;min-height:0}
.lista-col{width:380px;max-width:100%;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.lista-tools{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.lista-tools input{width:100%;min-height:38px;border:1px solid var(--line-input);border-radius:8px;padding:0 12px;font-size:var(--fs-md)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-input);background:#fff;border-radius:999px;padding:0 12px;min-height:32px;white-space:nowrap;font-weight:600;color:var(--ink-soft);flex:0 0 auto}
.chip.activa{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.lista{flex:1;overflow-y:auto}
.fila{padding:10px 14px;border-bottom:1px solid #f0efe9;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.fila:hover{background:var(--surface-2)}
.fila.sel{background:var(--accent-soft)}
.fila .l1{display:flex;gap:8px;align-items:baseline}
.fila .de{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.fila .fh{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.fila .as{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
.fila .rs{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sm);color:var(--muted)}
.fila.nol .de,.fila.nol .as{font-weight:700;color:var(--ink)}
.fila.nol::before{content:"";position:absolute}
.estrella{color:#e3a600}
.cnt{color:var(--muted);font-size:var(--fs-xs);font-weight:400}
.cita-btn{border:1px solid var(--line-input);background:#fff;border-radius:6px;padding:2px 10px;font-weight:700;color:var(--ink-soft);margin:8px 12px}
.mas{padding:12px 12px 80px;text-align:center}
.lector-col{flex:1;min-width:0;display:flex;flex-direction:column;background:#fafaf8}
.lector-vacio{margin:auto;color:var(--muted);text-align:center;padding:20px}
.lector{display:flex;flex-direction:column;min-height:0;flex:1}
.lector-cab{padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.lector-cab h2{font-size:var(--fs-lg);margin-bottom:6px;line-height:1.3;word-break:break-word}
.lector-cab .meta{font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.5;word-break:break-word}
.lector-acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lector-cuerpo{flex:1;min-height:200px;display:flex}
.lector-cuerpo iframe{flex:1;border:none;background:#fff;width:100%}
.lector-cuerpo pre{flex:1;overflow:auto;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:var(--fs-md);line-height:1.5;background:#fff}
.adj{padding:8px 16px;background:#fff;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-soft)}
.responder{padding:10px 84px 10px 12px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.responder textarea{flex:1;min-height:40px;max-height:140px;resize:vertical;border:1px solid var(--line-input);border-radius:8px;padding:9px 10px;font-size:var(--fs-md)}
.atras{display:none}
.modal.grande{max-width:760px}
.rd-fila{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:2px 0}
.rd-fila label{width:52px;flex:0 0 52px;font-size:var(--fs-sm);color:var(--muted)}
.rd-fila input{flex:1;min-width:0;border:none;outline:none;min-height:38px;font-size:var(--fs-md);padding:0 4px;background:transparent}
.rd-mas{border:none;background:none;color:var(--accent);font-weight:700;font-size:var(--fs-sm);padding:6px}
.rd-barra{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 0;border-bottom:1px solid var(--line)}
.rd-b{border:none;background:none;border-radius:6px;min-width:34px;min-height:34px;padding:0 8px;font-size:var(--fs-base);color:var(--ink-soft)}
.rd-b:hover{background:var(--accent-soft);color:var(--accent)}
.rd-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.rd-emojis{position:absolute;top:100%;left:0;z-index:5;display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;max-width:100%}
.rd-emojis button{border:none;background:none;font-size:20px;min-width:32px;min-height:32px;border-radius:6px}
.rd-emojis button:hover{background:var(--accent-soft)}
.rd-editor{min-height:200px;max-height:42vh;overflow:auto;padding:12px 4px;outline:none;font-size:var(--fs-md);line-height:1.5;word-break:break-word}
.rd-editor blockquote{margin:0 0 0 .8ex;border-left:2px solid #ccc;padding-left:1ex;color:var(--ink-soft)}
.rd-editor a{color:var(--accent)}
.rd-x{border:none;background:none;color:var(--muted);padding:0 2px;font-size:12px}
.rd-nota{margin-right:auto;font-size:var(--fs-xs);color:var(--muted);align-self:center}
@media (max-width:760px){.velo:has(.modal.grande){padding:0}.modal.grande{max-width:none;height:100%;border-radius:0;display:flex;flex-direction:column}.modal.grande .rd-editor{flex:1;max-height:none}.rd-emojis{grid-template-columns:repeat(8,1fr)}}
.adj{display:flex;flex-wrap:wrap;gap:6px}
.adj-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-input);background:#fff;border-radius:8px;padding:6px 10px;font-size:var(--fs-sm);font-weight:600;color:var(--ink);max-width:100%}
.adj-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.adj-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adj-btn small{color:var(--muted);font-weight:400}
/* agenda: día a la izquierda, semana a la derecha */

/* Descargas en la app de iPhone (17/10/2026): dentro del WebView de iOS las descargas por <a download> (Excel, etc.) no hacen nada. En la app nativa (Capacitor) el archivo se guarda en la caché y se abre la hoja de
   compartir de iOS (Guardar en Archivos, AirDrop, Mail...). En el navegador común este bloque no hace nada. */
(function(){
  var Cap = null;
  try{ Cap = window.Capacitor || (window.parent && window.parent.Capacitor) || (window.top && window.top.Capacitor); }catch(e){}
  if(!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return;
  var P = Cap.Plugins || {};
  if(!P.Filesystem || !P.Share) return;
  function guardarYCompartir(blob, nombre){
    var r = new FileReader();
    r.onload = function(){
      var b64 = String(r.result).split(',')[1] || '';
      P.Filesystem.writeFile({ path: nombre, data: b64, directory: 'CACHE' })
        .then(function(res){ return P.Share.share({ title: nombre, url: res.uri }); })
        .catch(function(e){ if(!/cancel/i.test(String(e && (e.message || e)))) alert('No se pudo guardar el archivo: ' + (e && e.message || e)); });
    };
    r.readAsDataURL(blob);
  }

    if(!a || !a.download || !/^blob:/.test(a.href || '')) return false;

    return true;
  }

  HTMLAnchorElement.prototype.click = function(){ if(interceptar(this)) return; return clickOrig.apply(this, arguments); };
  var dispOrig = EventTarget.prototype.dispatchEvent;
  EventTarget.prototype.dispatchEvent = function(ev){ if(this instanceof HTMLAnchorElement && ev && ev.type === 'click' && interceptar(this)) return true; return dispOrig.apply(this, arguments); };
  document.addEventListener('click', function(e){ var a = e.target && e.target.closest && e.target.closest('a[download]'); if(a && interceptar(a)) e.preventDefault(); }, true);
})();

/* ═══ CELULAR (22/10/2026: «no se ve igual que el resto de los bloques, parece un Excel y los números con tantos dígitos me marean») ═══
   - bloques de cifras: de una columna con cifras gigantes a fichas de 2 por fila (como los indicadores de arriba), con la cifra más chica y en formato corto ($ 14.610 M)

.pnl-chips{display:none}

  /* 22/10/2026 («los cuadros están desalineados»): las 4 fichas son hijas directas salvo las 2 de abajo de «Acumulado del Año», que viven dentro de un contenedor display:contents y quedaban SIN fondo ni relleno (su texto arrancaba más a la izquierda que el de las de arriba).
     Además una etiqueta de 2 líneas empujaba la cifra más abajo que la de la ficha vecina de 1 línea: toda etiqueta reserva 2 líneas, así las cifras quedan a la misma altura. */

<body>

<div class="barra">
  <h1>Correo y Calendario</h1>
  <button type="button" class="chip-cuenta" id="chipCuenta" style="display:none" onclick="menuCuentas()" title="Cambiar de cuenta o agregar otra"><span class="av chico" id="avDesk"></span><span id="emailCuenta"></span><span class="caret">▾</span></button>
</div>
<header class="m-top" id="mTop">
  <button type="button" class="m-ic" onclick="abrirCajon()" aria-label="Menú">&#9776;</button>
  <div class="m-busca"><input id="mBuscar" type="search" placeholder="Buscar en el correo" enterkeyhint="search" onkeydown="if(event.key==='Enter'){buscarMovil()}"></div>
  <button type="button" class="m-av" id="mAvatar" onclick="menuCuentas()" aria-label="Cuentas"></button>
</header>
<div class="tabs" id="tabs" style="display:none">
  <button class="tab activa" id="tabCorreo" onclick="mostrar('correo')">✉ Correo <span class="bdg" id="bdgNoLeidos" style="display:none"></span></button>
  <button class="tab" id="tabAgenda" onclick="mostrar('agenda')">📅 Agenda</button>
  <span style="flex:1"></span>
  <button class="btn pri" id="btnNuevo" onclick="abrirRedactar()">Redactar</button>
</div>

<div class="cuerpo" id="cuerpo"><div class="estado" id="estado">Cargando…</div></div>
<button type="button" class="m-fab" id="mFab" onclick="fabAccion()"><span id="mFabIco">✎</span><span id="mFabTxt">Redactar</span></button>
<nav class="m-nav" id="mNav">
  <button type="button" id="mNavCorreo" class="activa" onclick="mostrar('correo')"><span class="m-nav-ico">✉<i class="bdg" id="mBdg" style="display:none"></i></span>Correo</button>
  <button type="button" id="mNavAgenda" onclick="mostrar('agenda')"><span class="m-nav-ico">&#128197;</span>Agenda</button>
</nav>
<div class="m-cajon" id="mCajon" onclick="if(event.target===this)cerrarCajon()"><aside id="mCajonPanel"></aside></div>

<script>
// Correo y Calendario (15/10/2026): Gmail y Google Calendar no se pueden embeber en un iframe, así que esta pantalla usa sus APIs oficiales (api/google-*.js). La sesión es la del panel (sessionStorage).
const SESION_KEY = 'icom_sesion_2026';
function token(){ try{ return (JSON.parse(sessionStorage.getItem(SESION_KEY) || '{}')).token || ''; }catch(e){ return ''; } }
// Meet/Calendar/Gmail no se pueden incrustar en la página (Google lo bloquea): se abren en una ventana emergente centrada, no en una pestaña del navegador.
function abrirVentana(url, ancho, alto){
  const w = Math.min(ancho || 1100, screen.availWidth - 20), h = Math.min(alto || 740, screen.availHeight - 40);
  const l = Math.max(0, Math.round((screen.availWidth - w) / 2)), t = Math.max(0, Math.round((screen.availHeight - h) / 2));
  const v = window.open(url, 'icom_ventana_' + (url.length % 997), 'popup=yes,width=' + w + ',height=' + h + ',left=' + l + ',top=' + t);
  if(v){ try{ v.focus(); }catch(e){} return false; }
  return true;   // si el navegador la bloquea, deja actuar al enlace normal
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, tipo){ const t = document.createElement('div'); t.className = 'toast' + (tipo === 'error' ? ' error' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 4200); }
async function api(ruta, cuerpo){
  cuerpo = cuerpo || {};
  if((ruta === 'google-correo' || ruta === 'google-agenda') && cuentaActual && cuerpo.cuenta === undefined) cuerpo = Object.assign({ cuenta: cuentaActual }, cuerpo);
  const r = await fetch('/api/' + ruta, { method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + token()}, body: JSON.stringify(cuerpo || {}), cache:'no-store' });
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok && !j.error) j.error = 'El servidor no respondió como se esperaba (código ' + r.status + ').';
  if(j.noConectado){ conectado = false; pintarInicio(); const e = new Error(j.error || 'Conectá tu cuenta de Google.'); e.noConectado = true; throw e; }
  if(!j.ok) throw new Error(j.error || 'No se pudo completar la acción.');
  return j;
}

let cuentas = [], cuentaActual = '', noLeidosCuenta = 0, conectado = false, configurado = true, vista = 'correo', carpeta = 'INBOX', consulta = '', siguiente = null, mensajes = [], selId = null, msgActual = null;
const cont = () => document.getElementById('cuerpo');

// Colores e iniciales para las "fotos" de remitentes y cuentas (como el avatar de Gmail).
const PALETA = ['#1a73e8', '#d93025', '#188038', '#e37400', '#9334e6', '#007b83', '#c5221f', '#5f6368', '#b06000', '#0b8043'];
function colorDe(t){ let h = 0; String(t || '?').toLowerCase().split('').forEach(c=>{ h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return PALETA[h % PALETA.length]; }
function inicial(t){ const x = String(t || '?').replace(/[^\p{L}\p{N}]/gu, ''); return (x[0] || '?').toUpperCase(); }
function avatarHtml(t, extra){ return '<span class="av' + (extra ? ' ' + extra : '') + '" style="background:' + colorDe(t) + '">' + esc(inicial(t)) + '</span>'; }
function renderCuenta(){
  const e = document.getElementById('emailCuenta'); if(e) e.textContent = cuentaActual;
  const d = document.getElementById('avDesk'); if(d){ d.textContent = inicial(cuentaActual); d.style.background = colorDe(cuentaActual); }
  const a = document.getElementById('mAvatar'); if(a){ a.textContent = inicial(cuentaActual); a.style.background = colorDe(cuentaActual); }
}
async function iniciar(){
  if(!token()){ cont().innerHTML = '<div class="estado err">Ingresá al panel para ver tu correo.</div>'; return; }
  try{
    const e = await api('google-conectar', { accion:'estado' });
    configurado = e.configurado; conectado = e.conectado; cuentas = e.cuentas || [];
    let guardada = ''; try{ guardada = localStorage.getItem('icom_correo_cuenta') || ''; }catch(x){}
    if(!cuentas.some(c=>c.email === cuentaActual)) cuentaActual = cuentas.some(c=>c.email === guardada) ? guardada : (e.email || '');
    if(!conectado){ try{ parent.postMessage({ type:'icom_correo_estado', noLeidos: 0 }, location.origin); }catch(x){} }
    renderCuenta();
  }catch(err){
    cont().innerHTML = '<div class="estado err">' + esc(err.message) + '</div>'; return;
  }
  pintarInicio();
}
function cambiarCuenta(i){
  const c = cuentas[i]; if(!c) return;
  cerrarModal();
  if(c.email === cuentaActual) return;
  cuentaActual = c.email; try{ localStorage.setItem('icom_correo_cuenta', cuentaActual); }catch(e){}
  mensajes = []; selId = null; msgActual = null; consulta = ''; carpeta = 'INBOX'; rangoDesde = null;
  renderCuenta(); mostrar(vista); refrescarNoLeidos();
}
function menuCuentas(){
  modal('<h3>Cuentas de Google</h3><div class="cu-lista">' + cuentas.map((c, i)=>'<button type="button" class="cu-fila' + (c.email === cuentaActual ? ' act' : '') + '" onclick="cambiarCuenta(' + i + ')">' + avatarHtml(c.email) + '<span class="cu-mail">' + esc(c.email) + '</span>' + (c.email === cuentaActual ? '<span class="cu-ok">✓</span>' : '') + '</button>').join('') + '</div>'
    + '<button type="button" class="btn cu-agregar" onclick="cerrarModal();conectar()">＋ Agregar otra cuenta</button>'
    + '<p class="cu-nota">Podés sumar otras cuentas de Gmail o de Google Workspace. Se ven de a una; el globito del menú suma los correos sin leer de todas.</p>'
    + '<div class="pie"><button class="btn" onclick="desconectar()">Desconectar esta cuenta</button><button class="btn" onclick="cerrarModal()">Cerrar</button></div>', 'hoja');

const MARCAS_CITA = '.gmail_quote, blockquote[type="cite"], .gmail_extra, #divRplyFwdMsg, #appendonsend, .moz-cite-prefix, .yahoo_quoted, .protonmail_quote, blockquote';
function sinCita(html){
  try{
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const primera = doc.body.querySelector(MARCAS_CITA);
    if(!primera) return { html, cita:false };
    // Quita la cita y todo lo que viene después en el documento.
    let nodo = primera;
    while(nodo && nodo !== doc.body){
      while(nodo.nextSibling) nodo.parentNode.removeChild(nodo.nextSibling);
      const padre = nodo.parentNode; padre.removeChild(nodo); nodo = padre;
    }
    // Línea de atribución suelta ("El jue... escribió:") que quedó al final.
    const txt = doc.body.textContent.replace(/\s+$/, '');
    const lineas = [...doc.body.querySelectorAll('div,p,span')].reverse();
    for(const el of lineas){ if(/(escribi[óo]:?|wrote:?)\s*$/i.test(el.textContent.trim()) && el.textContent.length < 300){ el.remove(); break; } }
    if(!doc.body.textContent.trim() && !doc.body.querySelector('img')) return { html, cita:false };
    return { html: doc.body.innerHTML, cita:true };
  }catch(e){ return { html, cita:false }; }
}
function sinCitaTexto(txt){
  const lineas = String(txt || '').split('\n'), out = [];
  for(let i = 0; i < lineas.length; i++){
    const l = lineas[i];
    if(/^\s*>/.test(l) || /^\s*(El .{5,200}escribi[óo]:?|On .{5,200}wrote:?|-{2,}\s*(Original Message|Mensaje original|Forwarded)|De:\s.+|From:\s.+)\s*$/i.test(l)){ if(out.join('').trim()) return { texto: out.join('\n').replace(/\s+$/, ''), cita:true }; }
    out.push(l);
  }
  return { texto: txt, cita:false };
}
let verCita = false;
function cuerpoHtmlSeguro(m){
  if(m.html){
    const r = verCita ? { html: m.html, cita:false } : sinCita(m.html);
    m._hayCita = !verCita && r.cita;
    const doc = '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src https: data:; style-src \'unsafe-inline\'"><base target="_blank">'
      + '<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:#222;margin:12px;word-break:break-word}img{max-width:100%;height:auto}table{max-width:100%}</style></head><body>' + r.html + '</body></html>';
    return '<iframe sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin" referrerpolicy="no-referrer" onload="ajustarAltoIframe(this)" srcdoc="' + doc.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '" title="Cuerpo del mensaje"></iframe>';
  }
  const r = verCita ? { texto: m.texto, cita:false } : sinCitaTexto(m.texto);
  m._hayCita = !verCita && r.cita;
  const t = esc(r.texto).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, u=>'<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>');
  return '<pre>' + t + '</pre>';
}

/* ───────── REDACTAR ─────────
   Editor con formato (negrita, cursiva, subrayado, listas, enlaces), emojis, adjuntos (botón, arrastrar o pegar), Cc/Cco, responder, responder a todos y reenviar.
   Se envía como texto + HTML con los adjuntos incluidos (hasta 3 MB en total: es el tope de cada pedido al servidor). */
const EMOJIS = '😀 😃 😄 😁 😆 😅 😂 🤣 😊 🙂 😉 😍 🥰 😘 😎 🤩 🤔 🙄 😬 😢 😭 😡 👍 👎 👏 🙌 🙏 💪 👌 🤝 👋 ❤️ 💚 🔥 ⭐ ✅ ❌ ⚠️ 📎 📅 📞 📧 💡 🎉 🎂 🚀 ☕ 🌟'.split(' ');
const MAX_ADJ_BYTES = 3000000;
let redac = null, redacAbierta = false, redacRango = null;

// Deja sólo etiquetas y atributos inofensivos (lo que se envía y lo que se cita de otro mensaje).
const TAGS_OK = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'BR', 'P', 'DIV', 'SPAN', 'UL', 'OL', 'LI', 'A', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'PRE', 'CODE', 'TABLE', 'TBODY', 'THEAD', 'TR', 'TD', 'TH', 'HR']);
const TAGS_FUERA = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'FORM', 'INPUT', 'BUTTON', 'IMG', 'VIDEO', 'AUDIO', 'SVG', 'TEXTAREA', 'SELECT', 'HEAD', 'TITLE']);
function limpiarHtmlSalida(html){
  const doc = new DOMParser().parseFromString('<body>' + String(html || '') + '</body>', 'text/html');
  (function recorrer(nodo){
    [...nodo.childNodes].forEach(h=>{
      if(h.nodeType === 3) return;
      if(h.nodeType !== 1){ h.remove(); return; }
      if(TAGS_FUERA.has(h.tagName)){ h.remove(); return; }
      recorrer(h);
      if(!TAGS_OK.has(h.tagName)){ h.replaceWith(...h.childNodes); return; }
      const href = h.tagName === 'A' ? h.getAttribute('href') : null;
      [...h.attributes].forEach(a=>h.removeAttribute(a.name));
      if(h.tagName === 'A'){ if(href && /^(https?:|mailto:)/i.test(href.trim())) h.setAttribute('href', href.trim()); else h.replaceWith(...h.childNodes); }
      if(h.tagName === 'BLOCKQUOTE') h.setAttribute('style', 'margin:0 0 0 .8ex;border-left:1px solid #ccc;padding-left:1ex');
    });
  })(doc.body);
  return doc.body.innerHTML;
}
const correosDe = txt => (String(txt || '').match(/[^\s<>,;"']+@[^\s<>,;"']+\.[^\s<>,;"']+/g) || []);
const propio = () => (document.getElementById('emailCuenta') || {}).textContent || '';

function abrirRedactar(pref){
  if(vista === 'agenda'){ abrirNuevoEvento({ meet:true }); return; }
  pref = pref || {};
  redac = { adjuntos: [], threadId: pref.threadId || '', enRespuestaA: pref.enRespuestaA || '', referencias: pref.referencias || '' };
  redacAbierta = true;
  const btn = (cmd, rotulo, titulo)=>'<button type="button" class="rd-b" title="' + titulo + '" onmousedown="event.preventDefault()" onclick="formatoRedaccion(\'' + cmd + '\')">' + rotulo + '</button>';
  modal('<h3>' + esc(pref.titulo || 'Mensaje nuevo') + '</h3>'
    + '<div class="rd-fila"><label for="rPara">Para</label><input id="rPara" autocomplete="off" value="' + esc(pref.para || '') + '"><button type="button" class="rd-mas" id="rdMas" onclick="mostrarCcCco()">Cc Cco</button></div>'
    + '<div class="rd-fila" id="rdCcFila" style="display:' + (pref.cc ? 'flex' : 'none') + '"><label for="rCc">Cc</label><input id="rCc" autocomplete="off" value="' + esc(pref.cc || '') + '"></div>'
    + '<div class="rd-fila" id="rdCcoFila" style="display:none"><label for="rCco">Cco</label><input id="rCco" autocomplete="off"></div>'
    + '<div class="rd-fila"><label for="rAsunto">Asunto</label><input id="rAsunto" value="' + esc(pref.asunto || '') + '"></div>'
    + '<div class="rd-barra">' + btn('bold', '<b>B</b>', 'Negrita') + btn('italic', '<i>I</i>', 'Cursiva') + btn('underline', '<u>U</u>', 'Subrayado') + btn('strikeThrough', '<s>S</s>', 'Tachado')
    + '<span class="rd-sep"></span>' + btn('insertUnorderedList', '• Lista', 'Lista con viñetas') + btn('insertOrderedList', '1. Lista', 'Lista numerada') + btn('link', '🔗', 'Insertar enlace') + btn('removeFormat', 'Tx', 'Quitar formato')
    + '<span class="rd-sep"></span><button type="button" class="rd-b" title="Insertar emoji" onmousedown="event.preventDefault()" onclick="alternarEmojis()">😊</button>'
    + '<button type="button" class="rd-b" title="Adjuntar archivos" onclick="document.getElementById(\'rArchivo\').click()">📎 Adjuntar</button>'
    + '<div class="rd-emojis" id="rdEmojis" style="display:none">' + EMOJIS.map(e=>'<button type="button" onmousedown="event.preventDefault()" onclick="insertarEmoji(\'' + e + '\')">' + e + '</button>').join('') + '</div></div>'
    + '<div id="rEditor" class="rd-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Mensaje">' + (pref.html || '<div><br></div>') + '</div>'
    + '<div id="rAdjuntos" class="adj"></div><input type="file" id="rArchivo" multiple hidden>'
    + '<div class="pie"><span class="rd-nota">Adjuntos: hasta 3 MB en total</span><button class="btn" onclick="descartarRedaccion()">Descartar</button><button class="btn pri" id="btnEnviarNuevo" onclick="enviarRedaccion()">Enviar</button></div>', 'grande');
  const ed = document.getElementById('rEditor');
  ed.addEventListener('keyup', guardarSeleccion); ed.addEventListener('mouseup', guardarSeleccion); ed.addEventListener('blur', guardarSeleccion);
  ed.addEventListener('paste', e=>{
    const cb = e.clipboardData; if(!cb) return;
    const archivos = [...(cb.files || [])];
    if(archivos.length){ e.preventDefault(); agregarArchivos(archivos); return; }
    const h = cb.getData('text/html');
    if(h){ e.preventDefault(); document.execCommand('insertHTML', false, limpiarHtmlSalida(h)); }
  });
  ed.addEventListener('dragover', e=>e.preventDefault());
  ed.addEventListener('drop', e=>{ if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){ e.preventDefault(); agregarArchivos([...e.dataTransfer.files]); } });
  document.getElementById('rArchivo').addEventListener('change', e=>{ agregarArchivos([...e.target.files]); e.target.value = ''; });
  setTimeout(()=>{
    const foco = pref.para ? ed : document.getElementById('rPara'); if(foco) foco.focus();
    if(pref.para){ const r = document.createRange(); r.setStart(ed, 0); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }, 60);
}
function mostrarCcCco(){ document.getElementById('rdCcFila').style.display = 'flex'; document.getElementById('rdCcoFila').style.display = 'flex'; document.getElementById('rdMas').style.display = 'none'; }
function guardarSeleccion(){ const s = getSelection(); const ed = document.getElementById('rEditor'); if(s.rangeCount && ed && ed.contains(s.anchorNode)) redacRango = s.getRangeAt(0).cloneRange(); }
function restaurarSeleccion(){ const ed = document.getElementById('rEditor'); if(!ed) return; ed.focus(); if(redacRango){ const s = getSelection(); s.removeAllRanges(); s.addRange(redacRango); } }
async function formatoRedaccion(cmd){
  restaurarSeleccion();
  if(cmd === 'link'){
    guardarSeleccion();
    const url = await icomPedir('Dirección del enlace (por ejemplo https://www.icomsalud.com.ar)', { titulo:'Insertar enlace', valor:'https://', aceptar:'Insertar' });
    if(!url || !/^(https?:\/\/|mailto:)/i.test(url.trim())){ if(url) toast('El enlace debe empezar con https:// o mailto:', 'error'); restaurarSeleccion(); return; }
    restaurarSeleccion(); document.execCommand('createLink', false, url.trim()); return;
  }
  document.execCommand(cmd, false, null); guardarSeleccion();
}
function alternarEmojis(){ guardarSeleccion(); const p = document.getElementById('rdEmojis'); p.style.display = p.style.display === 'none' ? 'grid' : 'none'; }
function insertarEmoji(e){ restaurarSeleccion(); document.execCommand('insertText', false, e); guardarSeleccion(); }

function agregarArchivos(archivos){
  archivos.forEach(f=>{
    if(redac.adjuntos.length >= 10){ toast('Máximo 10 archivos por mensaje.', 'error'); return; }
    const total = redac.adjuntos.reduce((t, a)=>t + a.bytes, 0);
    if(total + f.size > MAX_ADJ_BYTES){ toast('“' + f.name + '” (' + tamanoLegible(f.size) + ') supera el límite de 3 MB en total. Enviá los archivos grandes desde Gmail.', 'error'); return; }
    const lector = new FileReader();
    lector.onload = ()=>{
      if(!redac) return;
      redac.adjuntos.push({ nombre: f.name || 'imagen.png', tipo: f.type || 'application/octet-stream', bytes: f.size, datos: String(lector.result).split(',')[1] || '' });
      pintarAdjuntosRedaccion();
    };
    lector.readAsDataURL(f);
  });
}
function pintarAdjuntosRedaccion(){
  const c = document.getElementById('rAdjuntos'); if(!c || !redac) return;
  c.innerHTML = redac.adjuntos.map((a, i)=>'<span class="adj-btn">📎 <span>' + esc(a.nombre) + '</span> <small>' + tamanoLegible(a.bytes) + '</small><button type="button" class="rd-x" onclick="quitarAdjuntoRedaccion(' + i + ')" title="Quitar" aria-label="Quitar ' + esc(a.nombre) + '">✕</button></span>').join('');
}
function quitarAdjuntoRedaccion(i){ redac.adjuntos.splice(i, 1); pintarAdjuntosRedaccion(); }

function redaccionConContenido(){
  const ed = document.getElementById('rEditor');
  return !!(ed && ed.innerText.trim()) || (redac && redac.adjuntos.length) || !!(document.getElementById('rAsunto') || {}).value;
}
async function descartarRedaccion(){
  if(redaccionConContenido() && !(await icomConfirmar('¿Descartar este mensaje? Se pierde lo que escribiste.', { aceptar:'Descartar', peligro:true }))) return;
  redacAbierta = false; redac = null; cerrarModal();
}
async function enviarRedaccion(){
  const ed = document.getElementById('rEditor'), btn = document.getElementById('btnEnviarNuevo');
  const para = document.getElementById('rPara').value.trim();
  if(!para){ toast('Indicá al menos un destinatario.', 'error'); document.getElementById('rPara').focus(); return; }
  const asunto = document.getElementById('rAsunto').value.trim();
  if(!asunto && !(await icomConfirmar('Este mensaje no tiene asunto. ¿Querés enviarlo igual?', { aceptar:'Enviar', titulo:'Enviar sin asunto', peligro:false }))) return;
  const html = limpiarHtmlSalida(ed.innerHTML), texto = ed.innerText.trim();
  if(!texto && !redac.adjuntos.length){ toast('El mensaje está vacío.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Enviando…';
  try{
    await api('google-correo', { accion:'enviar', para, cc: document.getElementById('rCc').value, cco: document.getElementById('rCco').value, asunto, texto,
      html: '<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222">' + html + '</div>', adjuntos: redac.adjuntos, threadId: redac.threadId, enRespuestaA: redac.enRespuestaA, referencias: redac.referencias });
    redacAbierta = false; redac = null; cerrarModal(); toast('Mensaje enviado.');
    if(carpeta === 'SENT') cargarLista(true);
  }catch(e){ toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Enviar'; }
}

// Responder / Responder a todos / Reenviar con el editor completo.
function citaDe(m, completo){
  const cuerpo = m.html ? limpiarHtmlSalida(completo ? m.html : sinCita(m.html).html) : esc(m.texto || '').replace(/\n/g, '<br>');
  return { cuerpo, fecha: new Date(m.fecha).toLocaleString('es-AR', { dateStyle:'full', timeStyle:'short' }) };
}
async function responderCompleto(modo, textoInicial){
  const m = msgActual; if(!m) return;
  const yo = propio().toLowerCase(), c = citaDe(m, modo === 'reenviar');
  const refs = ((m.referencias || '') + ' ' + (m.messageId || '')).trim();
  if(modo === 'reenviar'){
    abrirRedactar({ titulo:'Reenviar mensaje', asunto: /^(fwd?|rv):/i.test(m.asunto || '') ? m.asunto : 'Fwd: ' + (m.asunto || ''), threadId:'',
      html: '<div><br></div><div>---------- Mensaje reenviado ----------<br>De: ' + esc(m.de) + '<br>Fecha: ' + esc(c.fecha) + '<br>Asunto: ' + esc(m.asunto || '') + '<br>Para: ' + esc(m.para || '') + '</div><br><div>' + c.cuerpo + '</div>' });
    // Los adjuntos del original viajan con el reenvío (los que entren en el límite).
    for(const a of (m.adjuntos || [])){
      if(!redac) break;
      const usado = redac.adjuntos.reduce((t, x)=>t + x.bytes, 0);
      if(a.bytes > MAX_ADJ_BYTES || usado + a.bytes > MAX_ADJ_BYTES){ toast('“' + a.nombre + '” no se pudo incluir (supera los 3 MB). Reenvialo desde Gmail.', 'error'); continue; }
      try{
        const r = await fetch('/api/google-correo', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token() }, body: JSON.stringify({ accion:'adjunto', id: m.id, adjuntoId: a.adjuntoId, bytes: a.bytes, cuenta: cuentaActual }), cache:'no-store' });
        if(!r.ok) throw new Error('descarga');
        const blob = await r.blob();
        const datos = await new Promise(ok=>{ const l = new FileReader(); l.onload = ()=>ok(String(l.result).split(',')[1] || ''); l.readAsDataURL(blob); });
        if(redac) { redac.adjuntos.push({ nombre: a.nombre, tipo: a.tipo, bytes: a.bytes, datos }); pintarAdjuntosRedaccion(); }
      }catch(e){ toast('No se pudo incluir “' + a.nombre + '”.', 'error'); }
    }
    return;
  }
  const respuestaA = correosDe(m.responderA || m.de)[0] || '';
  let cc = '';
  if(modo === 'todos'){
    const otros = [...correosDe(m.para), ...correosDe(m.cc)].filter(x=>x.toLowerCase() !== yo && x.toLowerCase() !== respuestaA.toLowerCase());
    cc = [...new Set(otros)].join(', ');
  }
  const inicial = textoInicial ? '<div>' + esc(textoInicial).replace(/\n/g, '<br>') + '</div>' : '<div><br></div>';
  abrirRedactar({ titulo: modo === 'todos' ? 'Responder a todos' : 'Responder', para: respuestaA, cc, asunto: /^re:/i.test(m.asunto || '') ? m.asunto : 'Re: ' + (m.asunto || ''), threadId: m.threadId, enRespuestaA: m.messageId, referencias: refs,
    html: inicial + '<div><br></div><div>El ' + esc(c.fecha) + ', ' + esc(m.de) + ' escribió:</div><blockquote>' + c.cuerpo + '</blockquote>' });
}
function modal(html, clase){ cerrarModal(); const v = document.createElement('div'); v.className = 'velo'; v.id = 'modalVelo'; v.innerHTML = '<div class="modal ' + (clase || '') + '" role="dialog" aria-modal="true">' + html + '</div>'; v.addEventListener('mousedown', e=>{ if(e.target === v && !redacAbierta) cerrarModal(); }); document.body.appendChild(v); }
function cerrarModal(){ const v = document.getElementById('modalVelo'); if(v) v.remove(); redacAbierta = false; }
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && !redacAbierta && !document.querySelector('.icav-velo')) cerrarModal(); });

/* ───────── AGENDA ─────────
   Modelo tradicional: a la izquierda el detalle del día elegido (por defecto hoy), a la derecha la semana. Un clic en un horario libre abre "Nueva reunión" con ese día y hora y Google Meet tildado. */
const PX_HORA = 52, PX_HORA_DIA = 84, DIAS_CORTOS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
let rangoDesde = null, diaSel = null, agSub = 'dia', eventosActuales = [], agCargando = 0;
// Calendarios que la persona sumó al propio (ids), guardados por cuenta en este navegador. Vacío = sólo su calendario principal.
function claveCals(){ return 'icom_agenda_cals_' + (cuentaActual || ''); }
function calsElegidos(){ try{ const v = JSON.parse(localStorage.getItem(claveCals()) || '[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function guardarCals(ids){ try{ localStorage.setItem(claveCals(), JSON.stringify(ids)); }catch(e){} }
async function elegirCalendarios(){
  modal('<h3>Calendarios</h3><div class="estado">Cargando calendarios…</div>');
  try{
    const r = await api('google-agenda', { accion:'calendarios' });
    const sel = new Set(calsElegidos());
    const filas = r.calendarios.map(c=>'<label class="cal-fila"><input type="checkbox" value="' + esc(c.id) + '"' + (c.principal ? ' checked disabled' : (sel.has(c.id) ? ' checked' : '')) + '><span class="cal-punto" style="background:' + esc(c.color) + '"></span><span class="cal-nom">' + esc(c.nombre) + (c.principal ? ' <em>(el tuyo)</em>' : '') + '</span></label>').join('');
    modal('<h3>Calendarios</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Se muestra siempre tu calendario. Podés sumar otros vinculados a tu cuenta (se recuerda en este navegador).</p><div class="cal-lista">' + filas + '</div><div class="pie"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" onclick="guardarCalendarios()">Guardar</button></div>');
  }catch(e){ cerrarModal(); toast(e.message, 'error'); }
}
function guardarCalendarios(){
  const ids = [...document.querySelectorAll('.cal-lista input:checked:not(:disabled)')].map(i=>i.value);
  guardarCals(ids); cerrarModal(); cargarAgenda();
}
function inicioDia(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function lunesDe(d){ const x = inicioDia(d); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x; }
function sumarDias(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function claveDia(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function horaCorta(d){ return d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false }); }
function mayus(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
function fechaLarga(d){ return mayus(d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' })); }

function pintarAgenda(){
  if(!rangoDesde){ rangoDesde = lunesDe(new Date()); diaSel = inicioDia(new Date()); }
  const fin = sumarDias(rangoDesde, 6), f = d => d.toLocaleDateString('es-AR', { day:'numeric', month:'short' });
  cont().innerHTML = '<div class="ag-wrap sub-' + agSub + '">'
    + '<div class="ag-barra"><div class="ag-nav"><button class="btn" onclick="moverAgenda(-7)" aria-label="Semana anterior">‹</button><button class="btn" onclick="moverAgenda(0)">Hoy</button><button class="btn" onclick="moverAgenda(7)" aria-label="Semana siguiente">›</button></div>'
    + '<span class="rango">' + f(rangoDesde) + ' – ' + f(fin) + '</span>'
    + '<label class="ag-ir" title="Ir a una fecha"><span>Ir a</span><input type="date" id="agIr" value="' + claveDia(diaSel) + '" onchange="irAFecha(this.value)"></label>'
    + '<div class="ag-busca"><input type="search" id="agBuscar" placeholder="Buscar reunión…" onkeydown="if(event.key===\'Enter\')buscarEventos()"></div>'
    + '<button class="btn" onclick="elegirCalendarios()" title="Elegir qué calendarios ver">Calendarios</button>'
    + '<button class="btn pri" onclick="abrirNuevoEvento({ meet:true })">+ Nueva reunión</button></div>'
    + '<div class="ag-movil"><div class="ag-mes-fila"><button type="button" class="m-ic" onclick="moverAgenda(-7)" aria-label="Semana anterior">‹</button><button type="button" class="ag-mes" id="agMes" onclick="elegirFechaMovil()"></button><button type="button" class="m-ic" onclick="moverAgenda(7)" aria-label="Semana siguiente">›</button><button type="button" class="m-hoy" onclick="moverAgenda(0)">Hoy</button></div><div class="ag-tira" id="agTira"></div></div>'
    + '<div class="ag-sub"><button class="chip' + (agSub === 'dia' ? ' activa' : '') + '" onclick="agSub=\'dia\';pintarAgenda()">Día</button><button class="chip' + (agSub === 'semana' ? ' activa' : '') + '" onclick="agSub=\'semana\';pintarAgenda()">Semana</button></div>'
    + '<div class="ag-cuerpo"><section class="ag-izq" id="agIzq"></section><section class="ag-der" id="agDer"><div class="estado">Cargando agenda…</div></section></div></div>';
  cargarAgenda();
}
function moverAgenda(dias){
  if(dias === 0){ rangoDesde = lunesDe(new Date()); diaSel = inicioDia(new Date()); }
  else{ rangoDesde = sumarDias(rangoDesde, dias); diaSel = new Date(rangoDesde); }
  pintarAgenda();
}
function irAFecha(v){
  if(!v) return; const d = new Date(v + 'T00:00:00'); if(isNaN(d)) return;
  diaSel = inicioDia(d); rangoDesde = lunesDe(d); agSub = 'dia'; pintarAgenda();
}
function elegirFechaMovil(){
  const i = document.createElement('input'); i.type = 'date'; i.value = claveDia(diaSel); i.style.cssText = 'position:fixed;opacity:0;pointer-events:none;top:60px;left:20px';
  document.body.appendChild(i); i.addEventListener('change', ()=>{ irAFecha(i.value); i.remove(); }); i.addEventListener('blur', ()=>setTimeout(()=>i.remove(), 300));
  try{ i.showPicker(); }catch(e){ i.style.pointerEvents = 'auto'; i.style.opacity = '1'; i.focus(); }
}
function elegirDia(clave){ diaSel = new Date(clave + 'T00:00:00'); pintarAgendaContenido(); const i = document.getElementById('agIr'); if(i) i.value = clave; }

async function cargarAgenda(){
  const turno = ++agCargando, hasta = sumarDias(rangoDesde, 7);
  try{
    const r = await api('google-agenda', { accion:'eventos', desde: rangoDesde.toISOString(), hasta: hasta.toISOString(), calendarios: calsElegidos() });
    if(turno !== agCargando) return;
    eventosActuales = r.eventos; pintarAgendaContenido();
  }catch(e){ if(!e.noConectado){ const d = document.getElementById('agDer'); if(d) d.innerHTML = '<div class="estado err">' + esc(e.message) + '</div>'; } }
}
// Eventos (con su índice global) que caen en el día d; los de varios días aparecen en cada uno.
function eventosDelDia(d){
  const ini = inicioDia(d), fin = sumarDias(ini, 1), res = [];
  eventosActuales.forEach((ev, idx)=>{
    const a = new Date(ev.todoElDia ? ev.inicio + 'T00:00:00' : ev.inicio), b = new Date(ev.todoElDia ? ev.fin + 'T00:00:00' : ev.fin);
    if(a < fin && (b > ini || (+a === +b && a >= ini))) res.push({ ev, idx, a, b });
  });
  return res;
}
// Reparte los eventos que se pisan en columnas lado a lado.
function acomodar(items){
  items.sort((x, y)=>x.a - y.a || y.b - x.b);
  const grupos = []; let actual = null, finActual = 0;
  items.forEach(it=>{
    if(!actual || +it.a >= finActual){ actual = []; grupos.push(actual); finActual = 0; }
    actual.push(it); finActual = Math.max(finActual, +it.b);
  });
  grupos.forEach(g=>{
    const cols = [];
    g.forEach(it=>{ let c = cols.findIndex(f=>f <= +it.a); if(c < 0){ c = cols.length; cols.push(0); } cols[c] = +it.b; it.col = c; });
    g.forEach(it=>{ it.cols = cols.length; });
  });
  return items;
}
function limitesHoras(){
  let h0 = 8, h1 = 19;
  eventosActuales.forEach(ev=>{
    if(ev.todoElDia) return; const a = new Date(ev.inicio), b = new Date(ev.fin);
    h0 = Math.min(h0, a.getHours()); h1 = Math.max(h1, b.getMinutes() ? b.getHours() + 1 : b.getHours());
  });
  return [Math.max(0, Math.min(h0, 7)), Math.min(24, Math.max(h1, 19))];
}
function columnaDia(d, h0, h1, soloTitulo){
  const px = soloTitulo ? PX_HORA : PX_HORA_DIA, items = acomodar(eventosDelDia(d).filter(x=>!x.ev.todoElDia)), alto = (h1 - h0) * px, clave = claveDia(d);
  let html = '<div class="ag-col" style="height:' + alto + 'px" data-dia="' + clave + '" data-px="' + px + '" onclick="clicHorario(event,this,' + h0 + ')">';
  for(let h = 0; h < h1 - h0; h++) html += '<div class="ag-linea" style="top:' + (h * px) + 'px"></div>';
  items.forEach(it=>{
    const ini = Math.max(+it.a, +inicioDia(d)), fin = Math.min(+it.b, +sumarDias(inicioDia(d), 1));
    const top = ((new Date(ini).getHours() * 60 + new Date(ini).getMinutes()) / 60 - h0) * px, h = Math.max(24, (fin - ini) / 3600000 * px - 2);
    const ancho = 100 / it.cols, ev = it.ev;
    html += '<div class="ag-ev" style="top:' + top + 'px;height:' + h + 'px;left:calc(' + (it.col * ancho) + '% + 1px);width:calc(' + ancho + '% - 3px);--c:' + esc(ev.color) + '" onclick="event.stopPropagation();verEvento(' + it.idx + ')" title="' + esc(ev.titulo) + '">'
      + '<b>' + esc(ev.titulo) + '</b>' + (soloTitulo ? '' : '<span>' + horaCorta(new Date(it.a)) + ' – ' + horaCorta(new Date(it.b)) + '</span>') + (ev.meet && !soloTitulo ? '<a class="ag-meet" href="' + esc(ev.meet) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();return abrirVentana(this.href,1100,740)">Unirse</a>' : '') + '</div>';
  });
  if(clave === claveDia(new Date())){
    const ahora = new Date(), y = (ahora.getHours() * 60 + ahora.getMinutes()) / 60 - h0;
    if(y >= 0 && y <= h1 - h0) html += '<div class="ag-ahora" style="top:' + (y * px) + 'px"></div>';
  }
  return html + '</div>';
}
function horasEtiquetas(h0, h1, px){
  let html = '<div class="ag-horas" style="height:' + ((h1 - h0) * px) + 'px">';
  for(let h = h0; h < h1; h++) html += '<span style="top:' + ((h - h0) * px) + 'px">' + String(h).padStart(2, '0') + ':00</span>';
  return html + '</div>';
}
function todoElDiaHtml(d){
  return eventosDelDia(d).filter(x=>x.ev.todoElDia).map(x=>'<div class="ag-dia-completo" style="--c:' + esc(x.ev.color) + '" onclick="verEvento(' + x.idx + ')">' + esc(x.ev.titulo) + '</div>').join('');
}
function pintarAgendaContenido(){
  const izq = document.getElementById('agIzq'), der = document.getElementById('agDer'); if(!izq || !der) return;
  const [h0, h1] = limitesHoras(), hoy = claveDia(new Date()), esHoy = claveDia(diaSel) === hoy;
  // Izquierda: detalle del día elegido
  const delDia = eventosDelDia(diaSel).filter(x=>!x.ev.todoElDia);
  izq.innerHTML = '<div class="ag-izq-cab"><div><div class="ag-izq-tit">' + (esHoy ? 'Hoy' : DIAS_CORTOS[(diaSel.getDay() + 6) % 7]) + '</div><div class="ag-izq-fecha">' + fechaLarga(diaSel) + '</div></div>'
    + '<div class="ag-izq-n">' + delDia.length + (delDia.length === 1 ? ' reunión' : ' reuniones') + '</div></div>'
    + todoElDiaHtml(diaSel) + '<div class="ag-scroll" id="agScrollDia"><div class="ag-grilla">' + horasEtiquetas(h0, h1, PX_HORA_DIA) + '<div class="ag-cols">' + columnaDia(diaSel, h0, h1, false) + '</div></div></div>';
  // Celular: tira de la semana + lista del día elegido (como Google Calendar)
  const mes = document.getElementById('agMes'); if(mes) mes.textContent = mayus(diaSel.toLocaleDateString('es-AR', { month:'long', year:'numeric' }).replace(' de ', ' ')) + ' ▾';
  const tira = document.getElementById('agTira');
  if(tira) tira.innerHTML = [...Array(7)].map((_, i)=>{ const d = sumarDias(rangoDesde, i), c = claveDia(d), hay = eventosDelDia(d).length;
    return '<button type="button" class="ag-t-dia' + (c === claveDia(diaSel) ? ' sel' : '') + (c === hoy ? ' hoy' : '') + '" onclick="elegirDia(\'' + c + '\')"><small>' + DIAS_CORTOS[i].charAt(0) + '</small><b>' + d.getDate() + '</b><i class="' + (hay ? 'hay' : '') + '"></i></button>'; }).join('');
  const itemsDia = eventosDelDia(diaSel).sort((x, y)=>(x.ev.todoElDia ? 0 : 1) - (y.ev.todoElDia ? 0 : 1) || x.a - y.a);
  izq.innerHTML += '<div class="ag-dia-lista">' + (itemsDia.length ? itemsDia.map(x=>{ const ev = x.ev, hora = ev.todoElDia ? 'Todo el día' : horaCorta(x.a) + ' – ' + horaCorta(x.b);
    return '<div class="ev" onclick="verEvento(' + x.idx + ')"><span class="franja" style="background:' + esc(ev.color) + '"></span><div style="min-width:0;flex:1"><div class="tit">' + esc(ev.titulo) + '</div><div class="sub">' + hora + (ev.lugar ? ' · 📍 ' + esc(ev.lugar) : '') + '</div>'
      + (ev.meet ? '<a class="meet" href="' + esc(ev.meet) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();return abrirVentana(this.href,1100,740)">Unirse a la reunión</a>' : '') + '</div></div>'; }).join('') : '<div class="ag-libre ag-vacio-dia">Sin reuniones este día</div>') + '</div>';
  // Derecha: semana (grilla en escritorio, lista en celular)
  let cab = '<span class="ag-esq"></span>', cols = '', lista = '';
  for(let i = 0; i < 7; i++){
    const d = sumarDias(rangoDesde, i), c = claveDia(d), evs = eventosDelDia(d);
    cab += '<button class="ag-sem-dia' + (c === hoy ? ' hoy' : '') + (c === claveDia(diaSel) ? ' sel' : '') + '" onclick="elegirDia(\'' + c + '\')"><small>' + DIAS_CORTOS[i] + '</small><b>' + d.getDate() + '</b></button>';
    cols += columnaDia(d, h0, h1, true);
    lista += '<div class="dia' + (c === hoy ? ' hoy' : '') + '"><h3>' + fechaLarga(d) + '</h3>' + (evs.length ? evs.map(x=>{
      const ev = x.ev, hora = ev.todoElDia ? 'Todo el día' : horaCorta(x.a) + ' – ' + horaCorta(x.b);
      return '<div class="ev" onclick="verEvento(' + x.idx + ')"><span class="franja" style="background:' + esc(ev.color) + '"></span><span class="hora">' + hora + '</span><div style="min-width:0"><div class="tit">' + esc(ev.titulo) + '</div>'
        + (ev.lugar ? '<div class="sub">📍 ' + esc(ev.lugar) + '</div>' : '') + (ev.meet ? '<a class="meet" href="' + esc(ev.meet) + '" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();return abrirVentana(this.href,1100,740)">Unirse a la reunión</a>' : '') + '</div></div>';
    }).join('') : '<div class="ag-libre">Sin reuniones</div>') + '</div>';
  }
  const todoSem = [...Array(7)].map((_, i)=>'<div class="ag-td">' + todoElDiaHtml(sumarDias(rangoDesde, i)) + '</div>').join('');
  der.innerHTML = '<div class="ag-sem-grid">' + cab + '</div><div class="ag-sem-td"><span class="ag-esq"></span>' + todoSem + '</div>'
    + '<div class="ag-scroll" id="agScrollSem"><div class="ag-grilla">' + horasEtiquetas(h0, h1, PX_HORA) + '<div class="ag-cols ag-cols7">' + cols + '</div></div></div><div class="ag-sem-lista">' + lista + '</div>';
  ['agScrollDia', 'agScrollSem'].forEach(id=>{ const s = document.getElementById(id); if(s && s.clientHeight) s.scrollTop = Math.max(0, ((esHoy || id === 'agScrollSem' ? new Date().getHours() : 8) - h0 - 1) * (id === 'agScrollDia' ? PX_HORA_DIA : PX_HORA)); });
}
// Clic en un horario libre: nueva reunión con ese día y hora (redondeada a 30 min).
function clicHorario(e, col, h0){
  const y = e.clientY - col.getBoundingClientRect().top, min = Math.floor((y / (Number(col.dataset.px) || PX_HORA) * 60) / 30) * 30, h = h0 + Math.floor(min / 60), m = min % 60;
  abrirNuevoEvento({ dia: col.dataset.dia, hora: String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'), meet:true });
}
async function buscarEventos(){
  const q = (document.getElementById('agBuscar').value || '').trim(); if(q.length < 2) return;
  try{
    const r = await api('google-agenda', { accion:'buscar', q, calendarios: calsElegidos() });
    const filas = r.eventos.length ? r.eventos.map(ev=>{
      const a = new Date(ev.todoElDia ? ev.inicio + 'T00:00:00' : ev.inicio);
      return '<div class="ev" onclick="cerrarModal();irAFecha(\'' + claveDia(a) + '\')"><span class="franja" style="background:' + esc(ev.color) + '"></span><span class="hora">' + a.toLocaleDateString('es-AR', { day:'numeric', month:'short' }) + (ev.todoElDia ? '' : '<br>' + horaCorta(a)) + '</span><div style="min-width:0"><div class="tit">' + esc(ev.titulo) + '</div>' + (ev.calendario ? '<div class="sub">' + esc(ev.calendario) + '</div>' : '') + '</div></div>';
    }).join('') : '<div class="vacio">No se encontraron reuniones con “' + esc(q) + '”.</div>';
    modal('<h3>Resultados para “' + esc(q) + '”</h3><div style="max-height:60vh;overflow:auto">' + filas + '</div><div class="pie"><button class="btn" onclick="cerrarModal()">Cerrar</button></div>');
  }catch(e){ toast(e.message, 'error'); }
}
function verEvento(i){
  const ev = eventosActuales[i]; if(!ev) return;
  modal('<h3>' + esc(ev.titulo) + '</h3><p style="color:var(--ink-soft);margin-bottom:8px">' + (ev.todoElDia ? 'Todo el día' : new Date(ev.inicio).toLocaleString('es-AR', { dateStyle:'full', timeStyle:'short' }) + ' – ' + horaCorta(new Date(ev.fin))) + '</p>'
    + (ev.lugar ? '<p style="margin-bottom:6px">📍 ' + esc(ev.lugar) + '</p>' : '') + (ev.calendario ? '<p style="margin-bottom:6px;color:var(--muted)">Calendario: ' + esc(ev.calendario) + '</p>' : '')
    + (ev.descripcion ? '<p style="white-space:pre-wrap;margin:8px 0;word-break:break-word">' + esc(ev.descripcion.replace(/<[^>]+>/g, ' ')) + '</p>' : '')
    + '<div class="pie">' + (ev.meet ? '<a class="btn pri" style="display:inline-flex;align-items:center;text-decoration:none" href="' + esc(ev.meet) + '" target="_blank" rel="noopener noreferrer" onclick="return abrirVentana(this.href,1100,740)">Unirse a la reunión</a>' : '')
    + (ev.link ? '<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="' + esc(ev.link) + '" target="_blank" rel="noopener noreferrer" onclick="return abrirVentana(this.href,1100,760)">Abrir en Google Calendar</a>' : '') + '<button class="btn" onclick="cerrarModal()">Cerrar</button></div>');
}
function abrirNuevoEvento(pref){
  pref = pref || {};
  const hoy = new Date(), p = n => String(n).padStart(2, '0');
  const d = pref.dia || (diaSel ? claveDia(diaSel) : claveDia(hoy));
  const h1 = pref.hora || (p(Math.min(hoy.getHours() + 1, 22)) + ':00');
  const [hh, mm] = h1.split(':').map(Number), fin = new Date(2000, 0, 1, hh, mm + 60), h2 = p(fin.getHours()) + ':' + p(fin.getMinutes());
  modal('<h3>Nueva reunión</h3><div class="campo"><label>Título</label><input id="eTit" placeholder="Ej.: Reunión de seguimiento"></div><div class="fila-campos"><div class="campo"><label>Fecha</label><input id="eDia" type="date" value="' + d + '"></div>'
    + '<div class="campo"><label>Desde</label><input id="eIni" type="time" value="' + h1 + '" step="900" onchange="ajustarFinEvento()"></div><div class="campo"><label>Hasta</label><input id="eFin" type="time" value="' + (fin.getDate() === 1 ? h2 : '23:59') + '" step="900"></div></div>'
    + '<div class="campo"><label>Invitados (emails separados por coma, opcional)</label><input id="eInv"></div><div class="campo"><label>Lugar (opcional)</label><input id="eLug"></div>'
    + '<label style="display:flex;gap:8px;align-items:center;margin:4px 0 8px"><input type="checkbox" id="eMeet" style="min-height:0;width:18px;height:18px"' + (pref.meet ? ' checked' : '') + '> Agregar videollamada de Google Meet</label>'
    + '<div class="pie"><button class="btn" onclick="cerrarModal()">Cancelar</button><button class="btn pri" id="btnCrearEv" onclick="crearEvento()">Crear</button></div>');
  setTimeout(()=>{ const e = document.getElementById('eTit'); if(e) e.focus(); }, 50);
}
function ajustarFinEvento(){
  const i = document.getElementById('eIni').value; if(!i) return;
  const [h, m] = i.split(':').map(Number), f = new Date(2000, 0, 1, h, m + 60), p = n => String(n).padStart(2, '0');
  if(f.getDate() === 1) document.getElementById('eFin').value = p(f.getHours()) + ':' + p(f.getMinutes());
}
async function crearEvento(){
  const dia = document.getElementById('eDia').value, ini = document.getElementById('eIni').value, fin = document.getElementById('eFin').value;
  const b = document.getElementById('btnCrearEv'); b.disabled = true;
  try{
    await api('google-agenda', { accion:'crear', titulo: document.getElementById('eTit').value, inicio: new Date(dia + 'T' + ini).toISOString(), fin: new Date(dia + 'T' + fin).toISOString(),
      invitados: document.getElementById('eInv').value.split(/[,;\s]+/).filter(Boolean), lugar: document.getElementById('eLug').value, meet: document.getElementById('eMeet').checked });
    cerrarModal(); toast('Reunión creada.'); if(dia){ const x = new Date(dia + 'T00:00:00'); diaSel = inicioDia(x); rangoDesde = lunesDe(x); } pintarAgenda();
  }catch(e){ toast(e.message, 'error'); b.disabled = false; }
}

iniciar();
</script>
